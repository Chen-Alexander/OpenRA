name: Upstream Localization Watch

on:
  schedule:
    # Every day 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Watch localization PRs
        uses: actions/github-script@v7
        with:
          script: |
            const prs = [
              { n: 22517, name: 'Russian localization / language selection infrastructure' },
              { n: 22531, name: 'Chinese localization (zh-CN)' },
              { n: 22629, name: 'Traditional Chinese language pack (zh-TW)' }
            ];
            const marker = '[solar] upstream localization merged';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            for (const pr of prs) {
              try {
                const { data } = await github.rest.pulls.get({
                  owner: 'OpenRA',
                  repo: 'OpenRA',
                  pull_number: pr.n
                });
                if (!data.merged) continue;

                const title = `${marker} #${pr.n}`;
                if (issues.some(i => i.title === title)) continue;

                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  labels: ['solar-migration'],
                  body: [
                    `OpenRA/OpenRA#${pr.n} (${pr.name}) has been merged upstream.`,
                    '',
                    'Migration checklist:',
                    '',
                    '1. `git fetch upstream`',
                    '2. Verify which of our `solar` commits are now redundant.',
                    '3. Drop our core patch commits and rebase translation data only:',
                    '   ```',
                    '   git rebase --onto upstream/bleed <solar-core-tag> solar',
                    '   ```',
                    '4. Keep only `mods/*/fluent/zh-Hans/*.ftl`, fonts and `FluentLanguages` lines.',
                    '5. Build and test a language switch, then push `solar`.'
                  ].join('\n')
                });
              } catch (e) {
                core.warning(`Failed to check PR #${pr.n}: ${e.message}`);
              }
            }
